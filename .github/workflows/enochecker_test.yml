name: enochecker_test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    env:
      ENOCHECKER_CHECKER_ADDRESS: localhost
      ENOCHECKER_CHECKER_PORT: 11984

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Set up Python 3.11
      uses: actions/setup-python@v2
      with:
        python-version: 3.11
    - name: Install enochecker_test
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade enochecker-test
    - name: start service
      run: |
        PROJECT="${COMPOSE_PROJECT_NAME:-signmemaybe-${GITHUB_RUN_ID:-local}}"
        cd service
        docker compose -p "${PROJECT}-service" build --no-cache
        docker compose -p "${PROJECT}-service" up --force-recreate -d
    - name: start checker
      run: |
        PROJECT="${COMPOSE_PROJECT_NAME:-signmemaybe-${GITHUB_RUN_ID:-local}}"
        cd checker
        docker compose -p "${PROJECT}-checker" build --no-cache
        docker compose -p "${PROJECT}-checker" up --force-recreate -d
    - name: obtain Docker host IP
      run: |
        echo "ENOCHECKER_SERVICE_ADDRESS=$(ip -4 address show dev eth0 | grep inet | awk '{ print $2 }' | sed 's|/.*$||')" >> $GITHUB_ENV
    - name: Wait for 10 seconds
      run: for i in $(seq 1 10); do echo "waiting.. $i"; sleep 1; done
    - name: run enochecker_test
      run: |
        enochecker_test
    - name: Dump docker logs on failure
      if: failure()
      uses: jwalton/gh-docker-logs@v1
      with:
        dest: './logs'
    - name: Tar logs
      if: failure()
      run: tar cvzf ./logs.tgz ./logs
    - name: Upload logs to GitHub
      if: failure()
      uses: actions/upload-artifact@master
      with:
        name: logs.tgz
        path: ./logs.tgz
    - name: Kill docker containers
      if: failure() || success()
      run: |
        PROJECT="${COMPOSE_PROJECT_NAME:-signmemaybe-${GITHUB_RUN_ID:-local}}"
        (cd service && docker compose -p "${PROJECT}-service" down --volumes --remove-orphans)
        (cd checker && docker compose -p "${PROJECT}-checker" down --volumes --remove-orphans)
