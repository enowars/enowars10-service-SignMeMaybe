version: '2.1'

services:
  signmemaybe-checker:
    build: .
    # The checker runs a HTTP interfaces, so we need to map port 3031 to the outside (port 8000).
    ports:
      - 11984:8000
    environment:
      - MONGO_ENABLED=1
      - MONGO_HOST=signmemaybe-mongo
      - MONGO_PORT=27017
      - MONGO_USER=signmemaybe
      - MONGO_PASSWORD=signmemaybe
    mem_limit: 1G
    memswap_limit: 2G
    restart: unless-stopped
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000
  # The python checkerlib requires a mongo db!
  signmemaybe-mongo:
    image: mongo:7
    #ports:
    #  - 27017:27017
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: signmemaybe
      MONGO_INITDB_ROOT_PASSWORD: signmemaybe
    mem_limit: 1G
    memswap_limit: 2G
    restart: unless-stopped
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000
        
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1420
